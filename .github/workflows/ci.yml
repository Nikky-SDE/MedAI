name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'phase-*'
      - 'docs/*'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Strict TypeScript Check
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests & Coverage
        run: npm run test:coverage

      - name: Run Next.js Production Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mock-ci-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-ci-anon-key-placeholder
          GROQ_API_KEY: mock-ci-groq-key
          MOCK_LLM: 'true'
        run: npm run build
